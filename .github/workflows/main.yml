name: Build HomeHub Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project
        working-directory: HomeHub_Mobile_Tablet_UI_REWORK_v3/HomeHubMobile
        run: |
          echo "===== PROJECT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

      - name: Build APK
        working-directory: HomeHub_Mobile_Tablet_UI_REWORK_v3/HomeHubMobile
        run: |
          gradle --no-daemon \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-debug-apk
          path: HomeHub_Mobile_Tablet_UI_REWORK_v3/HomeHubMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
