name: Build HomeHub Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "Mobile/settings.gradle.kts" ] || [ -f "Mobile/settings.gradle" ]; then
            echo "dir=Mobile" >> "$GITHUB_OUTPUT"
          else
            echo "Android Gradle project not found."
            find . -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
